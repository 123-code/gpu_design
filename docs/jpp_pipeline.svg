  <text class="addr" x="1188" y="397" text-anchor="end">4</text>
  <text class="code" x="1200" y="397" xml:space="preserve">BRzp Lend1</text>
  <text class="code" x="1450" y="397" xml:space="preserve">1000 011 000 001010</text>
  <text class="hex" x="1638" y="397">860A</text>
  <text class="note" x="1686" y="397">Lend1 = 10</text>
  <rect x="1162" y="405" width="266" height="24" fill="#F6E3B8" rx="3"/>
  <rect x="1442" y="405" width="346" height="24" fill="#F6E3B8" rx="3"/>
  <text class="addr" x="1188" y="423" text-anchor="end">5</text>
  <text class="code" x="1200" y="423" xml:space="preserve">ADD R6, R0, R1</text>
  <text class="code" x="1450" y="423" xml:space="preserve">0001 110 000 000001</text>
  <text class="hex" x="1638" y="423">1C01</text>
  <rect x="1162" y="431" width="266" height="24" fill="#F6E3B8" rx="3"/>
  <rect x="1442" y="431" width="346" height="24" fill="#F6E3B8" rx="3"/>
  <text class="addr" x="1188" y="449" text-anchor="end">6</text>
  <text class="code" x="1200" y="449" xml:space="preserve">ADDI R0, R6, #0</text>
  <text class="code" x="1450" y="449" xml:space="preserve">0101 000 110 000000</text>
  <text class="hex" x="1638" y="449">5180</text>
  <text class="addr" x="1188" y="475" text-anchor="end">7</text>
  <text class="code" x="1200" y="475" xml:space="preserve">ADDI R6, R1, #1</text>
  <text class="code" x="1450" y="475" xml:space="preserve">0101 110 001 000001</text>
  <text class="hex" x="1638" y="475">5C41</text>
  <text class="addr" x="1188" y="501" text-anchor="end">8</text>
  <text class="code" x="1200" y="501" xml:space="preserve">ADDI R1, R6, #0</text>
  <text class="code" x="1450" y="501" xml:space="preserve">0101 001 110 000000</text>
  <text class="hex" x="1638" y="501">5380</text>
  <rect x="1162" y="509" width="266" height="24" fill="#DCEBF7" rx="3"/>
  <rect x="1442" y="509" width="346" height="24" fill="#DCEBF7" rx="3"/>
  <text class="addr" x="1188" y="527" text-anchor="end">9</text>
  <text class="code" x="1200" y="527" xml:space="preserve">BR Lcond1</text>
  <text class="code" x="1450" y="527" xml:space="preserve">1000 111 000 000010</text>
  <text class="hex" x="1638" y="527">8E02</text>
  <text class="note" x="1686" y="527">Lcond1 = 2</text>
  <rect x="1162" y="535" width="266" height="24" fill="#DCEBF7" rx="3"/>
  <rect x="1442" y="535" width="346" height="24" fill="#DCEBF7" rx="3"/>
  <text class="lbl" x="1200" y="553" xml:space="preserve">Lend1:</text>
  <text class="note" x="1450" y="553">no bits</text>
  <text class="addr" x="1188" y="579" text-anchor="end">10</text>
  <text class="code" x="1200" y="579" xml:space="preserve">MOV R6, #63</text>
  <text class="code" x="1450" y="579" xml:space="preserve">0010 110 000 111111</text>
  <text class="hex" x="1638" y="579">2C3F</text>
  <text class="addr" x="1188" y="605" text-anchor="end">11</text>
  <text class="code" x="1200" y="605" xml:space="preserve">STR R0, [R6]</text>
  <text class="code" x="1450" y="605" xml:space="preserve">1011 000 110 000000</text>
  <text class="hex" x="1638" y="605">B180</text>
  <text class="addr" x="1188" y="631" text-anchor="end">12</text>
  <text class="code" x="1200" y="631" xml:space="preserve">RET</text>
  <text class="code" x="1450" y="631" xml:space="preserve">1111 000 000 000000</text>
  <text class="hex" x="1638" y="631">F000</text>
  <text class="addr" x="1188" y="657" text-anchor="end">13</text>
  <text class="code" x="1200" y="657" xml:space="preserve">RET</text>
  <text class="code" x="1450" y="657" xml:space="preserve">1111 000 000 000000</text>
  <text class="hex" x="1638" y="657">F000</text>
  <line x1="40" y1="672" x2="1770" y2="672" stroke="#ddd"/>
  <text class="s" x="40" y="700">What you write: two variables, a loop that runs</text>
  <text class="s" x="40" y="717">while i &lt; 4, and yeet to send the result back.</text>
  <text class="s" x="370" y="700">The lexer cuts the text into words it recognizes:</text>
  <text class="s" x="370" y="717">keywords, names, numbers and symbols. Spaces are thrown</text>
  <text class="s" x="370" y="734">away.</text>
  <text class="s" x="760" y="700">The parser arranges the words into a tree that shows what is</text>
  <text class="s" x="760" y="717">inside what: the loop owns its condition and its body.</text>
  <text class="s" x="1170" y="700">Codegen walks the tree and writes</text>
  <text class="s" x="1170" y="717">instructions. s gets R0, i gets R1, R6</text>
  <text class="s" x="1170" y="734">holds temporary values. The loop</text>
  <text class="s" x="1170" y="751">becomes CMP + branches to labels.</text>
  <text class="s" x="1450" y="700">The assembler turns each instruction into 16 bits.</text>
  <text class="s" x="1450" y="717">Labels and comments get no address; branches get the</text>
  <text class="s" x="1450" y="734">label's address. The 2nd RET works around the loader</text>
  <text class="s" x="1450" y="751">dropping the last word.</text>
  <rect x="40" y="790" width="18" height="14" fill="#DCEBF7" stroke="#999"/>
  <text class="s" x="66" y="802">the loop, followed through every stage</text>
  <rect x="330" y="790" width="18" height="14" fill="#F6E3B8" stroke="#999"/>
  <text class="s" x="356" y="802">s = s + i, followed through every stage</text>
</svg>
