  <text class="code" x="1450" y="293" xml:space="preserve">0010 001 000 000000</text>
  <text class="hex" x="1638" y="293">2200</text>
  <rect x="1162" y="301" width="266" height="24" fill="#DCEBF7" rx="3"/>
  <rect x="1442" y="301" width="346" height="24" fill="#DCEBF7" rx="3"/>
  <text class="lbl" x="1200" y="319" xml:space="preserve">Lcond1:</text>
  <text class="note" x="1450" y="319">no bits</text>
  <rect x="1162" y="327" width="266" height="24" fill="#DCEBF7" rx="3"/>
  <rect x="1442" y="327" width="346" height="24" fill="#DCEBF7" rx="3"/>
  <text class="addr" x="1188" y="345" text-anchor="end">2</text>
  <text class="code" x="1200" y="345" xml:space="preserve">MOV R6, #4</text>
  <text class="code" x="1450" y="345" xml:space="preserve">0010 110 000 000100</text>
  <text class="hex" x="1638" y="345">2C04</text>
  <rect x="1162" y="353" width="266" height="24" fill="#DCEBF7" rx="3"/>
  <rect x="1442" y="353" width="346" height="24" fill="#DCEBF7" rx="3"/>
  <text class="addr" x="1188" y="371" text-anchor="end">3</text>
